version: "3.8"

volumes:
  local_postgres_data: {}
  local_postgres_data_backups: {}

services:
  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: sportfy_production_postgres
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
      - local_postgres_data_backups:/backups
    env_file: ./.env
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:7.0.7-alpine
  
  redis-channels:
    image: redis:7.0.7-alpine

  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: sportfy_production_django
    volumes:
      - .:/app
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    command: /start
    restart: always

  celeryworker:
    <<: *django
    image: sportfy_production_celeryworker
    volumes:
        - .:/app
    ports: []
    depends_on:
      - redis
      - django
    command: /start-celeryworker
    restart: always
  
  flower:
    <<: *django
    image: sportfy_production_flower
    ports:
      - "5555:5555"
    command: /start-flower
