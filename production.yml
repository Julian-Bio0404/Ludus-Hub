version: "3.8"

volumes:
  local_postgres_data: {}
  local_postgres_data_backups: {}
  local_mongo_data: {}
  production_elasticsearch_data: {}
  certs:
    driver: local
  esdata01:
    driver: local

services:
  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: ludushub_production_postgres
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
      - local_postgres_data_backups:/backups
    env_file: ./.env
    ports:
      - "5432:5432"
    container_name: postgres
    restart: always
    container_name: postgres

  mongodb:
    image: mongo:7.0.1
    volumes:
      - local_mongo_data:/data/db
    env_file: ./.env
    ports:
      - '27017:27017'
    container_name: mongodb
    restart: always
    container_name: mongodb

  redis:
    image: redis:7.2.1-alpine
    container_name: redis
    restart: always
    container_name: redis

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.13
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 \{\} \;;
        find . -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120
    container_name: elasticsearch

  es01:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - cluster.initial_master_nodes=es01
      # - discovery.seed_hosts=es02,es03
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    container_name: es-node-1

  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: ludushub_production_django
    volumes:
      - ./web-1:/web-1
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    command: /start
    restart: always
    container_name: django

  celeryworker:
    <<: *django
    image: ludushub_production_celeryworker
    volumes:
      - ./web-1:/web-1
    env_file:
      - ./.env
    ports: []
    depends_on:
      - redis
      - django
    command: /start-celeryworker
    restart: always
    container_name: celeryworker
  
  flower:
    <<: *django
    image: ludushub_production_flower
    env_file:
      - ./.env
    ports:
      - "5555:5555"
    command: /start-flower
    restart: always
    container_name: flower

  fastapi:
    build:
      context: .
      dockerfile: ./compose/production/fastapi/Dockerfile
    volumes:
      - ./web-2:/web-2
    env_file:
      - ./.env
    ports:
      - "8001:8001"
    command: /start
    restart: always
    container_name: fastapi
