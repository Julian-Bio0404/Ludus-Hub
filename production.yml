version: "3.8"

volumes:
  local_postgres_data: {}
  local_postgres_data_backups: {}
  local_mongo_data: {}

services:
  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: sportfy_production_postgres
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
      - local_postgres_data_backups:/backups
    env_file: ./.env
    ports:
      - "5432:5432"
    restart: always

  mongodb:
    image: mongo:latest
    volumes:
      - local_mongo_data:/data/db
    env_file: ./.env
    ports:
      - '27017:27017'
    restart: always

  redis:
    image: redis:7.0.7-alpine
    restart: always

  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: sportfy_production_django
    volumes:
      - ./web-1:/web-1
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    command: /start
    restart: always

  celeryworker:
    <<: *django
    image: sportfy_production_celeryworker
    volumes:
      - ./web-1:/web-1
    env_file:
      - ./.env
    ports: []
    depends_on:
      - redis
      - django
    command: /start-celeryworker
    restart: always
  
  flower:
    <<: *django
    image: sportfy_production_flower
    env_file:
      - ./.env
    ports:
      - "5555:5555"
    command: /start-flower
    restart: always

  fastapi:
    build:
      context: .
      dockerfile: ./compose/production/fastapi/Dockerfile
    volumes:
      - ./web-2:/web-2
    env_file:
      - ./.env
    ports:
      - "8001:8001"
    command: /start
    restart: always