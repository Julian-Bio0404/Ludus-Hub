version: "3"

volumes:
  local_postgres_data: {}
  local_postgres_data_backups: {}

services:
  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: sportfy_production_postgres
    deploy:
      resources:
        limits:
          memory: 300M
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
      - local_postgres_data_backups:/backups
    env_file: ./.env
    ports:
      - "5432:5432"

  redis:
    image: redis:7.0.5-alpine
    deploy:
      resources:
        limits:
          memory: 300M
  
  redis-channels:
    image: redis:7.0.5-alpine
    deploy:
      resources:
        limits:
          memory: 200M

  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: sportfy_local_django
    volumes:
      - .:/app
    env_file:
      - ./.env
    deploy:
      resources:
        limits:
          memory: 300M
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    command: /start

  celeryworker:
    <<: *django
    image: sportfy_local_celeryworker
    volumes:
      - .:/app
    deploy:
      resources:
        limits:
          memory: 300M
    ports: []
    depends_on:
      - redis
      - django
    command: /start-celeryworker
